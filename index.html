<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tufte's Razor · An interactive guide to the data-ink ratio</title>
    <meta
      name="description"
      content="Learn how Edward Tufte's data-ink ratio really works. Drag bar widths, strip gridlines and resize labels, and watch every pixel of a chart get counted as data-ink, redundant ink or non-data ink."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="preload" href="/fonts/et-book/et-book-roman-line-figures.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('tufte_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
