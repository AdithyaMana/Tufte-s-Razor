<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tufte's Razor - Data-Ink Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              tufte: {
                bg: '#fffff8', 
                text: '#111111',
                ink: '#2c3e50',
                paper: '#f5f5dc',
                accent: '#e74c3c'
              }
            },
            backgroundImage: {
              'dot-pattern': "radial-gradient(circle, #00000010 1px, transparent 1px)",
              'dot-pattern-dark': "radial-gradient(circle, #ffffff10 1px, transparent 1px)",
            },
            backgroundSize: {
              'dot-size': '24px 24px',
            },
            keyframes: {
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              },
              scan: {
                '0%, 100%': { top: '0%', opacity: '0.4' },
                '50%': { top: '95%', opacity: '1' }
              }
            },
            animation: {
              shimmer: 'shimmer 2s infinite linear',
              scan: 'scan 3s ease-in-out infinite',
            }
          }
        }
      }
    </script>
    <style>
      body {
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      html {
        scroll-behavior: smooth;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
      }
    }
    </script>
  </head>
  <body class="min-h-screen bg-zinc-50 dark:bg-zinc-950">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
